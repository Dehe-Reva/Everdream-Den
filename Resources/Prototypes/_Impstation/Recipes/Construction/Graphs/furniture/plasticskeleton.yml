- type: constructionGraph
  id: MannequinSkeleton
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: mannequin
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Plastic
              amount: 5 # DEN: 10 -> 5
            - material: MetalRod
              amount: 2
              doAfter: 2
    - node: mannequin
      entity: MannequinSkeleton
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:SpawnPrototype
              prototype: SheetPlastic
              amount: 5 # DEN: 10 -> 5
            - !type:SpawnPrototype
              prototype: PartRodMetal
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 3
        - to: mannequinglow
          completed:
            - !type:EmptyAllContainers
          steps:
          - tag: Glowstick
            icon:
              sprite: Objects/Misc/glowstick.rsi
              state: glowstick_base
            name: glowstick # DEN: have to un-localize this sorry
            doAfter: 2
    - node: mannequinglow
      entity: MannequinSkeletonGlowing
      edges:
      - to: start
        completed:
          - !type:EmptyAllContainers
          - !type:SpawnPrototype
            prototype: SheetPlastic
            amount: 5 # DEN: 10 -> 5
          - !type:SpawnPrototype
            prototype: PartRodMetal
            amount: 2
        steps:
          - tool: Screwing
            doAfter: 3
